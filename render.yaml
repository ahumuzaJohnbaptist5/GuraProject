services:
  - type: web
    name: gura-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SESSION_DAYS
        value: 7
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        fromService:
          type: web
          name: gura-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: gura-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node deploy-server.mjs
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: gura-api
          envVarKey: RENDER_EXTERNAL_URL
