services:
  - type: web
    name: gura-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SESSION_DAYS
        value: 7
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        value: https://gura-web-bkid.onrender.com
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false

  - type: web
    name: gura-web
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node deploy-server.mjs
    envVars:
      - key: VITE_API_URL
        value: https://gura-api-272p.onrender.com
