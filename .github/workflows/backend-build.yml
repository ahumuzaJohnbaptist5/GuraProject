name: Backend build and database smoke test
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gura
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gura"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gura
      WEB_ORIGIN: http://127.0.0.1:5173
      PORT: 8787
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Compile TypeScript
        run: npm run build
      - name: Run PostgreSQL migrations
        run: npm run db:migrate
      - name: Verify product catalog and health endpoints
        run: |
          node dist/index.js &
          sleep 3
          curl --fail --silent http://127.0.0.1:8787/health | grep '"ok":true'
          node -e 'fetch("http://127.0.0.1:8787/api/commerce/products").then(r => r.json()).then(d => { if (!Array.isArray(d.products) || d.products.some(p => p.isDemo)) process.exit(1); }).catch(() => process.exit(1))'
          node -e 'fetch("http://127.0.0.1:8787/api/commerce/catalog").then(async r => { const d=await r.json(); if (!r.ok || !Array.isArray(d.products) || !d.pagination) process.exit(1); }).catch(() => process.exit(1))'
      - name: Gate core registration, session, catalogue and access-control flows
        run: RELEASE_SMOKE_ALLOW_WRITES=1 node scripts/release-smoke.mjs
      - name: Build combined web and API for free single-service mode
        working-directory: .
        run: npm ci && npm run build
      - name: Verify embedded API without any upstream public HTTP hop
        working-directory: .
        env:
          GURA_EMBEDDED_API: "1"
          AUDIT_SIGNING_KEY: "ci-only-development-audit-signing-key-123456"
          API_PROXY_TARGET: "http://127.0.0.1:9"
          PORT: "8788"
          WEB_ORIGIN: "https://gura-web-bkid.onrender.com"
        run: |
          node deploy-server.mjs > /tmp/gura-embedded.log 2>&1 &
          echo $! > /tmp/gura-embedded.pid
          trap 'kill $(cat /tmp/gura-embedded.pid) 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:8788/health >/dev/null; then break; fi
            sleep 0.2
          done
          curl --fail --silent http://127.0.0.1:8788/ | grep -qi "html"
          cd server
          RELEASE_SMOKE_ALLOW_WRITES=1 RELEASE_SMOKE_BASE_URL=http://127.0.0.1:8788 node scripts/release-smoke.mjs

